<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPCH Medical Equipment Hub | โรงพยาบาลพิษณุเวช</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Prompt', -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px;
      max-width: 520px;
      box-shadow: 0 4px 20px rgba(0, 46, 110, 0.06);
    }
    .logo {
      height: 48px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #004b93;
      margin: 0 0 10px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 24px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: #0284c7;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 6px 14px;
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="โรงพยาบาลพิษณุเวช" class="logo">
    <h1>ระบบเครื่องมือแพทย์ โรงพยาบาลพิษณุเวช</h1>
    <p>เคลียร์ข้อมูลการออกแบบเดิมเรียบร้อยแล้ว<br>ฐานข้อมูล Google Forms, ข้อมูลที่สแกน, และระบบ GAS ยังคงอยู่อย่างครบถ้วน พร้อมสำหรับการเริ่มต้นออกแบบใหม่</p>
    <div class="badge">Ready for Fresh Start</div>
  </div>
</body>
</html>
