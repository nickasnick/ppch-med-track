<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPCH Medical Equipment Hub | โรงพยาบาลพิษณุเวช</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    (function () {
      // 1. Check user preference from localStorage
      var savedPref = localStorage.getItem('ppch_med_view');
      var search = window.location.search || '';

      if (savedPref === 'desktop') {
        window.location.replace('desktop.html' + search);
        return;
      }
      if (savedPref === 'mobile') {
        window.location.replace('mobile.html' + search);
        return;
      }

      // 2. Auto-detect Screen Width and User Agent
      var isMobileScreen = window.innerWidth < 768;
      var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      if (isMobileScreen || isMobileUA) {
        window.location.replace('mobile.html' + search);
      } else {
        window.location.replace('desktop.html' + search);
      }
    })();
  </script>
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e40af 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; padding: 20px; text-align: center;">

  <div class="medical-cross-container" style="margin-bottom: 24px;">
    <div class="cross-v"></div>
    <div class="cross-h"></div>
  </div>

  <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 6px;">
    กำลังตรวจสอบขนาดหน้าจอและเชื่อมต่อระบบ...
  </h2>
  <p style="font-size: 13px; color: #94a3b8; max-width: 480px; margin-bottom: 28px;">
    ระบบตรวจเช็คความพร้อมใช้และติดตามสถานที่เครื่องมือแพทย์ โรงพยาบาลพิษณุเวช (PPCH)
  </p>

  <!-- Fallback manual selection if script redirect was delayed -->
  <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
    <a href="desktop.html" class="btn-glass" style="padding: 10px 20px; font-size: 13px;">
      <span class="material-icons-round" style="font-size: 18px;">desktop_windows</span>
      <span>เปิดสำหรับจอคอมพิวเตอร์ (Widescreen 100%)</span>
    </a>
    <a href="mobile.html" class="btn-glass btn-glass-teal" style="padding: 10px 20px; font-size: 13px;">
      <span class="material-icons-round" style="font-size: 18px;">smartphone</span>
      <span>เปิดสำหรับสมาร์ตโฟน (Mobile)</span>
    </a>
  </div>

</body>
</html>
